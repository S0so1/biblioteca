{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Biblioteca{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'biblioteca/style.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="{% url 'lista_livros' %}" class="brand">Biblioteca</a>
            <nav>
                <a href="{% url 'lista_livros' %}">Livros</a>
                <a href="{% url 'relatorio_livros' %}">Relatório</a>
                <a href="/admin/">Admin</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% for message in messages %}
        <div class="msg {{ message.tags }}">{{ message }}</div>
        {% endfor %}
        {% block conteudo %}{% endblock %}
    </main>
</body>
</html>
